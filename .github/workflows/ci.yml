name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel in-progress runs for the same branch or pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Run Linting and Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout repository content

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Ruff Linter
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0

      - name: Run Ruff Formatter Check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: format --check

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Run Test Suite
        run: python3 -m unittest discover -s tests

      - name: Build the widget
        run: python3 build.py

      - name: Verify committed artifacts are up to date
        run: |
          git diff --exit-code index.html dist/ || {
            echo "::error::dist/widget.min.html or index.html is stale. Run 'python3 build.py' and commit the result."
            exit 1
          }
