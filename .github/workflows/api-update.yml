name: Automated API Version Updater

on:
  schedule:
    - cron: '0 4 * * *' # Run daily at 4:00 AM UTC
  workflow_dispatch: # Allow manual trigger

# Cancel in-progress runs for the same branch or pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check-api-version:
    name: Check and Update API Version
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the updated API version back to the repository
      pull-requests: write # Required to automatically create a pull request for the API update
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check for new Space Devs API version
        id: check_version
        run: |
          # sort -V | tail -1 keeps the highest version if the docs page ever
          # advertises more than one, and guarantees a single-line value
          LATEST_VERSION=$(curl -s https://ll.thespacedevs.com/docs/ | grep -oP 'url: "/\K[0-9]+\.[0-9]+\.[0-9]+(?=/json")' | sort -V | tail -n 1)
          CURRENT_VERSION=$(grep -oP 'll\.thespacedevs\.com/\K[0-9]+\.[0-9]+\.[0-9]+' src/widget.html | head -n 1)

          if ! echo "$LATEST_VERSION" | grep -qP '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Could not extract a valid latest version from the thespacedevs.com docs page (got: '$LATEST_VERSION')"
            exit 1
          fi

          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            echo "New API version found: $LATEST_VERSION (Current: $CURRENT_VERSION)"

            # Verify the advertised endpoint actually exists before pointing the widget at it
            if ! curl -sf "https://ll.thespacedevs.com/$LATEST_VERSION/json" -o /dev/null; then
              echo "Version $LATEST_VERSION is advertised but /$LATEST_VERSION/json is not reachable"
              exit 1
            fi

            echo "LATEST_VERSION=$LATEST_VERSION" >> $GITHUB_ENV
            echo "UPDATE_FOUND=true" >> $GITHUB_ENV

            # Extract release notes/announcements
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "API_ANNOUNCEMENTS<<$EOF" >> $GITHUB_ENV
            curl -s "https://ll.thespacedevs.com/$LATEST_VERSION/json" | jq -r '.info.description' | awk '/### Announcements/{flag=1; next} /^## /{flag=0} flag' | sed '/^[[:space:]]*$/d' >> $GITHUB_ENV
            echo "$EOF" >> $GITHUB_ENV

            # Update only the API base URL - an anchored replacement can never
            # touch other version-like strings (e.g. WIDGET_VERSION)
            sed -i "s|ll\.thespacedevs\.com/$CURRENT_VERSION|ll.thespacedevs.com/$LATEST_VERSION|g" src/widget.html

            # Fail loudly if the replacement did not land exactly as intended
            if ! grep -q "ll.thespacedevs.com/$LATEST_VERSION" src/widget.html; then
              echo "URL replacement failed: new version not present in src/widget.html"
              exit 1
            fi
            if grep -q "ll.thespacedevs.com/$CURRENT_VERSION" src/widget.html; then
              echo "URL replacement failed: old version still present in src/widget.html"
              exit 1
            fi
          else
            echo "API version $CURRENT_VERSION is up to date."
            echo "UPDATE_FOUND=false" >> $GITHUB_ENV
          fi

      - name: Setup Python
        if: env.UPDATE_FOUND == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'

      - name: Run Test Suite
        if: env.UPDATE_FOUND == 'true'
        env:
          LIVE_API_TEST: '1' # Validate the real API before opening a version-bump PR
        run: python3 -m unittest discover -s tests

      - name: Build the widget
        if: env.UPDATE_FOUND == 'true'
        run: python3 build.py

      - name: Create Pull Request
        if: env.UPDATE_FOUND == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'chore: update The Space Devs API to v${{ env.LATEST_VERSION }}'
          title: 'Update The Space Devs API to v${{ env.LATEST_VERSION }}'
          body: |
            Automatically generated PR to update The Space Devs API from version in source to the newly released **v${{ env.LATEST_VERSION }}**.

            ### 📢 Announcements / Release Notes
            ${{ env.API_ANNOUNCEMENTS }}

            The `build.py` script has been run to update `dist/widget.min.html` and `index.html`.
          branch: chore/update-space-devs-api
          base: main
