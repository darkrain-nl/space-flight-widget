name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout repository content
      pages: write # Required to upload and deploy to GitHub Pages
      id-token: write # Required to verify OIDC token for deployment security
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build fresh artifacts
        # Regenerate dist/widget.min.html and the index.html widget block from
        # src/widget.html at deploy time, so the live site can never serve a
        # stale committed artifact (build.py is stdlib-only)
        run: python3 build.py
      - name: Prepare Public Directory
        run: |
          mkdir public
          cp index.html public/
          [ -f "embed.html" ] && cp embed.html public/ || true
          [ -d "dist" ] && cp -r dist public/ || true
          [ -d "assets" ] && cp -r assets public/ || true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
